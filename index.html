<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner Stabil</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; margin: 0; }
    #reader { width: 100%; max-width: 450px; margin: 20px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #status { margin-top: 20px; font-weight: bold; font-size: 1.1em; color: #555; padding: 10px; }
    .error-msg { color: red !important; background: #ffebee; padding: 10px; border-radius: 5px; margin: 10px; }
  </style>
</head>
<body>

  <h2>Barcode / QR Scanner (Eksternal)</h2>
  <div id="reader"></div>
  <div id="status">Menginisialisasi kamera...</div>

  <script>
    // PENTING: GANTI DENGAN URL WEB APP ANDA YANG BERAKHIRAN /exec
    const WEB_APP_URL = https://script.google.com/macros/s/AKfycbw3G5aLhCJLl1SKFe8znNh45g1_Ed6xIdmUrowO5ExPl2lD68O7B00QUmkDWVQXxtGw/exec; 

    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
      // Hentikan scanner agar tidak mengirim data berkali-kali saat sukses
      html5QrcodeScanner.clear().then(() => {
        document.getElementById('status').innerText = "Mengirim " + decodedText + " ke Google Sheets...";
        document.getElementById('status').style.color = "blue";

        fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors", 
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ barcode: decodedText })
        })
        .then(() => {
          document.getElementById('status').innerText = "Berhasil Disimpan: " + decodedText;
          document.getElementById('status').style.color = "green";
          // Jalankan kamera lagi setelah 3 detik
          setTimeout(startScanner, 3000); 
        })
        .catch(err => {
          document.getElementById('status').innerText = "Gagal mengirim data ke Sheets.";
          document.getElementById('status').style.color = "red";
          setTimeout(startScanner, 3000);
        });
      }).catch(err => {
        console.error("Gagal menghentikan scanner:", err);
      });
    }

    function startScanner() {
      document.getElementById('status').innerText = "Menunggu scan...";
      document.getElementById('status').style.color = "#555";

      // Menggunakan konfigurasi object tunggal yang kompatibel dengan browser HP lama & baru
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
          fps: 10, 
          qrbox: { width: 250, height: 150 },
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        },
        /* verbose= */ false
      );
      
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanFailure(error) {
      // Diabaikan agar tidak memenuhi log saat kamera sedang mencari barcode
    }

    // Fungsi otomatis berjalan saat halaman web selesai dimuat
    window.addEventListener('DOMContentLoaded', (event) => {
      // Cek apakah browser mendukung kamera
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        startScanner();
      } else {
        document.getElementById('status').innerHTML = "<div class='error-msg'>Error: Browser Anda tidak mendukung akses kamera (WebRTC) atau koneksi tidak aman (wajib HTTPS).</div>";
      }
    });
  </script>
</body>
</html>
